<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>EnCopy 小红书图</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* The Xiaohongshu image set: eight 1080×1440 cards, ?n=1…8 picks one. The words are in CARDS below;
   cards 3–6 use stills of the Chinese film (img/, from stills.js), card 7 the theme strips the product page uses. */
:root { --sky: #1f45d8; --navy: #0f1638; --sun: #ffd33d; --cream: #fbf7ec; --kraft: #d6b184; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; background: var(--sky); }
body { position: relative; font-family: "Noto Sans SC", sans-serif; color: var(--cream); }
.n { position: absolute; left: 64px; top: 64px; padding: 10px 20px; border-radius: 26px; background: var(--sun); color: var(--navy); font: 700 26px/1 "Noto Sans SC"; }
.n span { font-family: "JetBrains Mono"; margin-left: 10px; opacity: .6; }
header { position: absolute; left: 64px; right: 64px; top: 130px; }
h1 { margin: 0; font: 900 84px/1.12 "Noto Sans SC"; letter-spacing: -.01em; }
h1 em, .sub em { font-style: normal; color: var(--sun); }
.sub { margin-top: 22px; font: 700 40px/1.35 "Noto Sans SC"; color: rgba(251,247,236,.88); }
.shot { position: absolute; left: 0; width: 1080px; overflow: hidden; }
.shot img { position: absolute; }
.foot { position: absolute; left: 64px; right: 64px; bottom: 60px; font: 500 28px/1.3 "Noto Sans SC"; color: rgba(251,247,236,.75); }
/* card 2: two papers on a line */
.rope { position: absolute; left: -20px; top: 470px; width: 1120px; height: 60px; }
.paper { position: absolute; top: 500px; width: 470px; padding: 40px 34px 34px; border-radius: 10px; color: #1d1f22; box-shadow: 0 24px 40px rgba(5,10,40,.35); }
.paper h3 { margin: 0 0 20px; font: 900 40px/1 "Noto Sans SC"; }
.paper ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
.paper li { font: 700 29px/1.35 "Noto Sans SC"; padding-left: 46px; position: relative; }
.paper li::before { position: absolute; left: 0; top: 0; font: 900 30px/1.35 "Noto Sans SC"; }
.paper.old { left: 46px; background: var(--cream); transform: rotate(-1.5deg); }
.paper.old li::before { content: "✕"; color: #c94a3a; }
.paper.new { left: 564px; background: var(--sun); transform: rotate(1.5deg); }
.paper.new li::before { content: "✓"; color: #1f7a3a; }
.peg { position: absolute; top: -26px; left: 50%; margin-left: -10px; width: 20px; height: 54px; border-radius: 4px;
  background: linear-gradient(90deg, #b07b45 0 46%, #8a5a2e 46% 54%, #d2a067 54%); box-shadow: 0 3px 4px rgba(0,0,0,.3); }
/* card 1 */
.bul { position: absolute; left: 64px; right: 64px; top: 1130px; margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
.bul li { font: 700 38px/1.25 "Noto Sans SC"; }
.bul b { display: inline-block; min-width: 72px; padding: 4px 14px; margin-right: 14px; border-radius: 12px; background: var(--cream); color: var(--navy); font: 700 32px/1.2 "JetBrains Mono", "Noto Sans SC"; text-align: center; }
/* card 7 */
.themes { position: absolute; left: 50px; right: 50px; top: 470px; display: grid; gap: 22px; }
.themes figure { margin: 0; display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 16px; }
.themes figcaption { font: 900 34px/1 "Noto Sans SC"; color: var(--sun); }
.themes img { width: 100%; border-radius: 12px; background: #fff; }
/* card 8 */
.list { position: absolute; left: 64px; right: 64px; top: 480px; display: grid; gap: 26px; }
.list div { display: flex; gap: 24px; align-items: center; padding: 26px 30px; border-radius: 18px; background: rgba(251,247,236,.1); font: 700 36px/1.3 "Noto Sans SC"; }
.list b { flex: none; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--cream); color: var(--navy); font: 900 34px/1 "Noto Sans SC"; }
.get { position: absolute; left: 64px; right: 64px; bottom: 150px; padding: 34px; border-radius: 24px; background: var(--sun); color: var(--navy); text-align: center; font: 900 52px/1.2 "Noto Sans SC"; }
.get small { display: block; font: 700 28px/1.3 "Noto Sans SC"; margin-top: 10px; opacity: .75; }
</style>
</head>
<body>
<script>
const CARDS = {
  1: { title: "Mac 剪贴板，<br><em>全挂一根绳上</em>", sub: "免费开源 · GitHub 搜 EnCopy", shot: { src: "img/pick.png", x: 250, y: 60, w: 1320, top: 440, h: 680 },
       bullets: [["⌥C", "叫出来，挑一件，⏎ 贴回去"], ["搜", "截图里的字也搜得到"], ["文件", "只记路径，一张不多存"]] },
  2: { title: "为什么自己动手改一个", sub: "喜欢 Tendedero，顺手改掉 5 处痛点",
       old: ["绳子挂满，最老的进废纸篓", "访达的文件挂不上", "只能用鼠标", "点一下只复制，不贴", "临时占掉 ⌫ 空格 ⌘Z 等键"],
       neu: ["挂满了掉进篮子，不删", "文件只记路径就能挂", "⌥C 叫出来，全程键盘", "⏎ 直接贴回去", "全局只占 ⌥C 一个键"] },
  3: { title: "<em>⌥C</em> 挑一件，<em>⏎</em> 直接贴回", sub: "不用切窗口，全程不用碰鼠标", shots: [{ src: "img/pick.png", x: 180, y: 60, w: 1440, top: 400, h: 300 }, { src: "img/paste.png", x: 400, y: 440, w: 1120, top: 780, h: 480 }] },
  4: { title: "直接打字就能搜历史", sub: "连<em>截图里的字</em>也能搜得到", shot: { src: "img/search.png", x: 330, y: 60, w: 1100, top: 430, h: 900 } },
  5: { title: "挂满了不删，<em>掉进篮子</em>", sub: "按 ↓ 展开列表，25 个文件只算一张", shot: { src: "img/list.png", x: 450, y: 90, w: 1020, top: 470, h: 860 } },
  6: { title: "截图右键还能这么用", sub: "<em>隔空投送</em>到手机，或<em>拿在手上</em>浮在眼前", shots: [
       { src: "img/share.png", x: 390, y: 110, w: 1140, top: 420, h: 590 }, { src: "img/hold.png", x: 230, y: 260, w: 1460, top: 1010, h: 410 }] },
  7: { title: "六套好看主题随心换", sub: "纸、像素、拟物、极简、霓虹、手账", themes: [["纸", "paper"], ["像素", "pixel"], ["拟物", "skeuo"], ["极简", "minimal"], ["霓虹", "neon"], ["手账", "washi"]] },
  8: { title: "数据只留在你的 Mac 上", sub: "不联网，不记密码，验证码 10 分钟自清", list: [["🔐", "密码框、密码 App 里的不记"], ["⏱", "验证码 10 分钟自己清掉"], ["📁", "文件只记路径，一张不多存"]],
       get: "GitHub 搜 EnCopy", getSub: "免费开源 · macOS 14 以上 · 下载地址在评论区" },
};
const n = +(new URLSearchParams(location.search).get("n") || 1), c = CARDS[n];
const shotHTML = (s) => { const k = 1080 / (s.w); return `<div class="shot" style="top:${s.top}px;height:${s.h}px"><img src="${s.src}" style="width:${1920 * k}px;left:${-s.x * k}px;top:${-s.y * k}px"></div>`; };
let html = `<div class="n">EnCopy<span>${n}/8</span></div><header><h1>${c.title}</h1><div class="sub">${c.sub}</div></header>`;
if (c.shot) html += shotHTML(c.shot);
if (c.shots) html += c.shots.map(shotHTML).join("");
if (c.old) html += `<svg class="rope" viewBox="0 0 1120 60"><path d="M0 10 Q560 60 1120 10" fill="none" stroke="#8a6a3d" stroke-width="9"/><path d="M0 10 Q560 60 1120 10" fill="none" stroke="#e6c995" stroke-width="4" stroke-dasharray="13 10"/></svg>
  <div class="paper old"><i class="peg"></i><h3>Tendedero</h3><ul>${c.old.map((x) => `<li>${x}</li>`).join("")}</ul></div>
  <div class="paper new"><i class="peg"></i><h3>EnCopy</h3><ul>${c.neu.map((x) => `<li>${x}</li>`).join("")}</ul></div>
  <div class="foot">感谢 Tendedero 作者开源（MIT），EnCopy 在它的基础上改</div>`;
if (c.themes) html += `<div class="themes">${c.themes.map(([z, f]) => `<figure><figcaption>${z}</figcaption><img src="../../docs/themes/${f}.png"></figure>`).join("")}</div>`;
if (c.list) html += `<div class="list">${c.list.map(([i, t]) => `<div><b>${i}</b>${t}</div>`).join("")}</div><div class="get">${c.get}<small>${c.getSub}</small></div>`;
if (c.bullets) html += `<ul class="bul">${c.bullets.map(([k, t]) => `<li><b>${k}</b>${t}</li>`).join("")}</ul>`;
document.body.innerHTML = html;
</script>
</body>
</html>
