<style>
/* EnCopy in 40 seconds: a 1920×1080 stage scaled to the window. render(t) sets every style from the time alone,
   so the same t always draws the same frame: the product page plays it live in an iframe, and promo/render.js
   screenshots it frame by frame into the MP4. Sound is synthesized with Web Audio on a context the page hands in.
   URL: ?lang=zh|en  ?theme=light|dark  ?t=12.5 (one still frame)  ?embed (wait for the page to drive it). */
:root {

  --f-head: "Space Grotesk", "Noto Sans SC", Inter, sans-serif; --f-body: Inter, "Noto Sans SC", sans-serif; --f-mono: "JetBrains Mono", "Noto Sans SC", monospace;
}
:root[data-theme="dark"] { --sky: #0e1a4a; --navy: #08102e; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--navy); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--navy); font-family: var(--f-body); color: var(--cream); }
.abs { position: absolute; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;

.s1-line { font: 700 92px/1.05 var(--f-head); letter-spacing: -.02em; white-space: nowrap; }

.clip { width: 980px; height: 150px; left: 470px; top: 520px; border-radius: 22px; background: var(--cream); color: #0f1638; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }

</style>

const DURATION = 39.9, FPS = 30;
/* The cut (0.4): the 0.3 film's scenes, trimmed where they only held still, with the basket-list scene put in

const SEGS = [[0, 0.4, 7.2], [7.2, 8.0, 11.7], [18.9, 21.5, 4.95], [23.85, null, 5.5], [29.35, 26.6, 4.1], [33.45, 30.7, 3.5], [36.95, 34.2, 2.95]];

const fromOld = (o) => { for (const [n, oo, l] of SEGS) if (oo !== null && o >= oo - 1e-6 && o < oo + l) return n + (o - oo); return null; };
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eIn = (p) => p * p * p;

// A slow breeze, so nothing on the line is ever perfectly still.

/* ---------- sound: a mallet groove and effects, synthesized on a context the host hands in ---------- */
function soundPlan() {
  const N = [];

  const arp = [0, 2, 1, 3, 2, 1, 3, 2];
  for (let i = 0, t = start; t < end - 0.01; i++, t = start + i * half) {
    const [tones, root] = chords[Math.floor(i / 8) % 4], step = i % 8, quiet = t >= light[0] && t < light[1];
    N.push({ t, v: "mallet", f: hz(tones[arp[step]]), g: step % 2 ? 0.4 : 0.55 });
    N.push({ t, v: "shaker", g: 0.18 });
    if (step % 2 === 0) N.push({ t: t + half / 2, v: "shaker", g: 0.25 });
    if (step === 0 || step === 4) { if (!quiet) N.push({ t, v: "kick" }); N.push({ t, v: "bass", f: hz(root) }); }
    if ((step === 2 || step === 6) && !quiet) N.push({ t, v: "clap" });
  }
  [53, 57, 60, 65, 69].forEach((m) => N.push({ t: end, v: "mallet", f: hz(m), g: 0.8, long: true }));
  N.push({ t: end, v: "bass", f: hz(41), long: true });

}
function Sound(ctx) {

    bass: (t, n) => tone(t, n.f, "triangle", 0.4, 0.006, n.long ? 0.9 : 0.28),
    kick: (t) => { const o = tone(t, 130, "sine", 0.7, 0.001, 0.12); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15); },
    clap: (t) => hiss(t, "bandpass", 2000, 0.7, 0.3, 0.001, 0.05),

    key: (t) => { hiss(t, "bandpass", 3500, 0.8, 0.5, 0.0005, 0.008); tone(t, 180, "sine", 0.3, 0.001, 0.015); },
    type: (t) => { hiss(t, "bandpass", 3500, 0.8, 0.22, 0.0005, 0.008); tone(t, 180, "sine", 0.13, 0.001, 0.015); },
    tick: (t) => hiss(t, "bandpass", 6000, 1, 0.35, 0.0005, 0.006),

    whoosh: (t) => hiss(t, "bandpass", 1200, 0.6, 0.3, 0, 0, 0.55),
    drop: (t) => { const o = tone(t, 180, "sine", 0.6, 0.001, 0.09); o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.2); hiss(t, "bandpass", 1200, 0.6, 0.15, 0, 0, 0.45); },

    start(from) {

/* ---------- playback ---------- */
const listeners = [];
